name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  h5:
    name: H5 静态检查 + 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uniapp
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: uniapp/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: SFC 语法检查
        run: node tools/check-sfc.mjs src/pages src/components

      - name: 云函数语法检查
        run: |
          set -e
          for f in uniCloud-aliyun/cloudfunctions/*/index.js; do
            echo "check $f"
            node --check "$f"
          done

      - name: 构建 H5
        run: pnpm build:h5

      - name: 上传 H5 产物
        uses: actions/upload-artifact@v4
        with:
          name: h5-dist
          path: uniapp/dist/build/h5
          retention-days: 7
  smoke:
    name: H5 冒烟测试（23 路由）
    runs-on: ubuntu-latest
    needs: h5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: uniapp/pnpm-lock.yaml

      - name: 安装依赖并构建 H5
        working-directory: uniapp
        run: |
          pnpm install --frozen-lockfile
          pnpm build:h5

      - name: 启动静态服务器
        run: |
          cd uniapp/dist/build/h5
          nohup python3 -m http.server 5280 >/dev/null 2>&1 &
          sleep 1
          curl -sf -o /dev/null http://127.0.0.1:5280/ && echo "server ok"

      - name: 启动 Chrome（runner 自带）
        run: |
          CHROME_BIN=""
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then CHROME_BIN="$c"; break; fi
          done
          if [ -z "$CHROME_BIN" ]; then echo "未找到 Chrome，跳过冒烟"; exit 0; fi
          nohup "$CHROME_BIN" --headless=new --remote-debugging-port=9222 --no-sandbox --disable-gpu about:blank >/dev/null 2>&1 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:9222/json/version && { echo "cdp ok"; break; }
            sleep 1
          done

      - name: 运行冒烟测试
        working-directory: uniapp
        run: |
          if ! curl -sf -o /dev/null http://127.0.0.1:9222/json/version; then
            echo "CDP 不可用，跳过冒烟（本地可手动执行 node tools/smoke-h5.mjs）"
            exit 0
          fi
          node tools/smoke-h5.mjs --out ../analysis/qa/smoke-report.json

      - name: 上传冒烟报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h5-smoke-report
          path: analysis/qa/smoke-report.json
          retention-days: 7
