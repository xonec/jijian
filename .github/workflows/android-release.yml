name: Android Release APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName（如 1.0.1；留空 = tag 去 v，或 1.0.0）'
        required: false
        default: ''
      version_code:
        description: 'versionCode（留空 = GITHUB_RUN_NUMBER）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: 构建签名 APK（WebView 外壳）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: uniapp/pnpm-lock.yaml

      - name: 构建 H5
        working-directory: uniapp
        run: |
          pnpm install --frozen-lockfile
          pnpm build:h5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android SDK 组件
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS_VERSION=34.0.0" >> "$GITHUB_ENV"

      - name: 安装依赖工具
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip

      - name: 解析版本号
        run: |
          set -e
          VN="${{ inputs.version_name }}"
          if [ -z "$VN" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VN="${GITHUB_REF_NAME#v}"; else VN="1.0.0"; fi
          fi
          VC="${{ inputs.version_code }}"
          if [ -z "$VC" ]; then VC="${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          echo "### 构建版本: $VN ($VC)" >> "$GITHUB_STEP_SUMMARY"

      - name: tag 构建必须提供签名 secrets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEY_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "tag 构建必须配置 secrets.RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD" >&2
            exit 1
          fi

      - name: 构建并签名 APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          OUT_DIR: release
        run: |
          chmod +x release/build-apk.sh
          ./release/build-apk.sh

      - name: 写入 Job Summary
        run: |
          {
            echo '```'
            cat release/*.sha256
            "${ANDROID_HOME}/build-tools/34.0.0/aapt2" dump badging release/*.apk | head -6 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 APK 构件
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            release/*.apk
            release/*.sha256
          retention-days: 30

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.apk
            release/*.sha256
          generate_release_notes: true
