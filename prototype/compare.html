<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>极简排班 · 官方截图 vs 复刻原型 对比</title>
<style>
  body{margin:0;background:#0b0b0c;color:#e9e9e9;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;padding:44px}
  h1{font-size:24px;margin:0 0 6px}

<body>

  <div class="row">
    <div><div class="cap"><b>排班首页 / 月历</b> · 官方 yj_qq_01</div><div class="official"><img src="reference/official_calendar.jpg" alt=""></div></div>

  </div>

    <div><div class="cap"><b>自定义班次</b> · 官方 yj_qq_02</div><div class="official"><img src="reference/official_work.jpg" alt=""></div></div>
